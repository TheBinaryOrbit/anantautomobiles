services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: anant_automobiles_db
    environment:
      POSTGRES_USER: ${DB_USER:-anant_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-anant_password_123}
      POSTGRES_DB: ${DB_NAME:-anantautomobiles}
      DATABASE_URL: postgresql://${DB_USER:-anant_user}:${DB_PASSWORD:-anant_password_123}@postgres:5432/${DB_NAME:-anantautomobiles}
      PORT: ${PORT:-3000}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./prisma/migrations:/docker-entrypoint-initdb.d
    networks:
      - anant_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-anant_user} -d ${DB_NAME:-anantautomobiles}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Node.js Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anant_automobiles_backend
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      DATABASE_URL: postgresql://${DB_USER:-anant_user}:${DB_PASSWORD:-anant_password_123}@postgres:5432/${DB_NAME:-anantautomobiles}
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./uploads:/app/uploads
      - ./public:/app/public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - anant_network
    restart: unless-stopped
    command: sh -c "npm run prisma:generate && npm run migrate:deploy && npm start"

volumes:
  postgres_data:
    driver: local

networks:
  anant_network:
    driver: bridge
