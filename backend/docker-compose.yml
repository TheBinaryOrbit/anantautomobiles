version: "3.9"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: anant_automobiles_db
    environment:
      POSTGRES_USER: anant_user
      POSTGRES_PASSWORD: anant_password_123
      POSTGRES_DB: anantautomobiles
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./prisma/migrations:/docker-entrypoint-initdb.d
    networks:
      - anant_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anant_user -d anantautomobiles"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anant_automobiles_backend
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://anant_user:anant_password_123@postgres:5432/anantautomobiles
    ports:
      - "3000:3000"
    volumes:
      - ./uploads:/app/uploads
      - ./public:/app/public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - anant_network
    restart: unless-stopped
    command: sh -c "sleep 5 && npx prisma generate && npx prisma migrate deploy && npm start"

volumes:
  postgres_data:

networks:
  anant_network:
    driver: bridge