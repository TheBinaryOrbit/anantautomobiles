version: "3.9"

services:
  # PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: anant_automobiles_db
    environment:
      POSTGRES_USER: anant_user
      POSTGRES_PASSWORD: anant_password_123
      POSTGRES_DB: anantautomobiles
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - anant_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anant_user -d anantautomobiles"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Backend
  backend:
    build: .
    container_name: anant_automobiles_backend

    # 🔥 THIS FIXES YOUR ORIGINAL ERROR
    env_file:
      - .env

    ports:
      - "3000:3000"

    volumes:
      - ./uploads:/app/uploads
      - ./public:/app/public

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - anant_network

    restart: unless-stopped

volumes:
  postgres_data:

networks:
  anant_network:
    driver: bridge